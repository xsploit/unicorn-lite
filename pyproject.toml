[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unicorn-lite"
version = "0.1.0"
description = "A persistent, cost-aware neural agent core with optional LLM speech"
requires-python = ">=3.10,<3.13"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "torch>=2.4",
  "transformers>=5.6",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
discord = ["discord.py>=2.4"]
dev = ["sentence-transformers>=3.0"]

[project.scripts]
unicorn-lite = "unicorn_lite.cli:main"

[tool.setuptools.packages.find]
include = ["unicorn_lite*"]
